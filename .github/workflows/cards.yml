name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  STYLE: theme=transparent&hide_border=true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fail_on_error: a rate-limited run fails instead of committing an error card, so the last good SVG stays
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&${{ env.STYLE }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.STYLE }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=cc-to-antigravity-cli-bridge&theme=transparent
          path: profile/pin-cc-to-antigravity-cli-bridge.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=cc-to-grok-bridge&theme=transparent
          path: profile/pin-cc-to-grok-bridge.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=claude-code-security-starter&theme=transparent
          path: profile/pin-claude-code-security-starter.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=geek-on-autopilot&theme=transparent
          path: profile/pin-geek-on-autopilot.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=always-free-macro-calendar&theme=transparent
          path: profile/pin-always-free-macro-calendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=stg-premium-chart&theme=transparent
          path: profile/pin-stg-premium-chart.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=heptabase-local-sync-security&theme=transparent
          path: profile/pin-heptabase-local-sync-security.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=build-your-own-spotify-listening-dna&theme=transparent
          path: profile/pin-build-your-own-spotify-listening-dna.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
